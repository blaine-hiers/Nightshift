name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # sweep.sh drives git and a stubbed gh against a scratch bare repo, so the
      # runner needs a git identity before the fixture can commit.
      - name: Configure git identity for the fixture
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - run: bash tests/sweep_test.sh
